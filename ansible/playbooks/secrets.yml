---
# ── Playbook: Push Secrets to Minikube ───────────────────────────
# Creates the k8s secret with MongoDB Atlas URI and JWT secret
# in your local Minikube cluster.
#
# Run:
#   ansible-playbook playbooks/secrets.yml \
#     -e "mongodb_uri='mongodb+srv://user:pass@cluster.mongodb.net/homely'" \
#     -e "jwt_secret='your_jwt_secret'"
# ──────────────────────────────────────────────────────────────────

- name: Push Secrets to Minikube
  hosts: local
  connection: local

  vars:
    mongodb_uri: "{{ mongodb_uri }}"
    jwt_secret:  "{{ jwt_secret }}"

  tasks:

    - name: Ensure homely namespace exists
      command: kubectl apply -f ../../k8s/namespace.yaml

    - name: Delete existing secret (clean slate)
      command: kubectl delete secret homely-secret -n homely --ignore-not-found=true

    - name: Create homely-secret in Minikube
      command: >
        kubectl create secret generic homely-secret
        --namespace=homely
        --from-literal=MONGODB_URI="{{ mongodb_uri }}"
        --from-literal=JWT_SECRET="{{ jwt_secret }}"

    - name: Verify secret created
      command: kubectl get secret homely-secret -n homely
      register: secret_check
      changed_when: false

    - name: Print confirmation
      debug:
        msg: "✅ Secret pushed to Minikube: {{ secret_check.stdout }}"
