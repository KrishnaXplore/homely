# ─── SonarQube Project Configuration ────────────────────────────
sonar.projectKey=krishnaxplore_homely
sonar.projectName=Homely - Natural Home Remedies
sonar.projectVersion=1.0
sonar.organization=krishnaxplore
sonar.branch.name=main

# Source directories
sonar.sources=frontend/src,backend
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.*,**/scripts/**,**/*.min.js

# JavaScript / JSX
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# SonarQube server — set via SONAR_HOST_URL env variable in CI
# sonar.host.url=http://localhost:9000   ← local only, do not uncomment in CI

# Language
sonar.language=js
