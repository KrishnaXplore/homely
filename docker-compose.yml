version: '3.9'

# MongoDB runs on Atlas (cloud). No local mongo container needed.
# Create a .env file with: MONGODB_URI=mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/homely

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homely-backend
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:-super_secret_homely_key_2026}
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: homely-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  sonarqube:
    image: sonarqube:community
    container_name: homely-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs

volumes:
  sonar_data:
  sonar_logs:
