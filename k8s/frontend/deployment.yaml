apiVersion: apps/v1
kind: Deployment
metadata:
  name: homely-frontend
  namespace: homely
  labels:
    app: homely-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: homely-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: homely-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/krishnaxplore/homely-frontend:IMAGE_TAG
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
