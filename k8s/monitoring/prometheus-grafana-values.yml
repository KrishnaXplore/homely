# ── Helm values for kube-prometheus-stack ────────────────────────
# Installs Prometheus + Grafana + Alertmanager in one shot.
# Applied by: ansible/playbooks/monitoring.yml
# ──────────────────────────────────────────────────────────────────

# ── Grafana ───────────────────────────────────────────────────────
grafana:
  enabled: true
  adminPassword: "homely@grafana2026"   # change in production

  service:
    type: NodePort
    nodePort: 32000

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: homely
          orgId: 1
          folder: Homely
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/homely

  # Pre-load Kubernetes cluster dashboard
  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 6417
        revision: 1
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 27
        datasource: Prometheus

# ── Prometheus ────────────────────────────────────────────────────
prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "300m"

    # Scrape all pods with annotation prometheus.io/scrape: "true"
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false

  service:
    type: NodePort
    nodePort: 32001

# ── Alertmanager ──────────────────────────────────────────────────
alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

# ── Node Exporter (host metrics) ──────────────────────────────────
nodeExporter:
  enabled: true

# ── Kube State Metrics (pod/deployment metrics) ───────────────────
kubeStateMetrics:
  enabled: true
