apiVersion: apps/v1
kind: Deployment
metadata:
  name: homely-mongodb
  namespace: homely
  labels:
    app: homely-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homely-mongodb
  template:
    metadata:
      labels:
        app: homely-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc
