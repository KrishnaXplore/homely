apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homely-ingress
  namespace: homely
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: homely.local        # change to your domain in production
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: homely-backend
                port:
                  number: 5002
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homely-frontend
                port:
                  number: 80
