name: Render — Deploy Backend

on:
  push:
    branches: [main]

jobs:
  render-deploy:
    name: Render — Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json"
          echo "✅ Render deployment triggered"
