name: CD — Docker Push & Kubernetes Deploy

on:
  push:
    branches: [main]          # deploy only on main

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/homely-frontend
  IMAGE_BACKEND:  ghcr.io/${{ github.repository_owner }}/homely-backend

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build & Push Docker Images to GHCR
  # ─────────────────────────────────────────────
  docker-push:
    name: Docker — Build & Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: sha-${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 2: Deploy to Kubernetes
  # ─────────────────────────────────────────────
  kubernetes-deploy:
    name: Kubernetes — Deploy to Cluster
    runs-on: ubuntu-latest
    needs: docker-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply namespace & config
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml

      - name: Substitute image tags in manifests
        run: |
          OWNER="${{ github.repository_owner }}"
          TAG="sha-${{ github.sha }}"
          sed -i "s|GITHUB_OWNER|${OWNER}|g; s|IMAGE_TAG|${TAG}|g" \
            k8s/backend/deployment.yaml \
            k8s/frontend/deployment.yaml

      - name: Deploy backend
        run: |
          kubectl apply -f k8s/backend/deployment.yaml
          kubectl apply -f k8s/backend/service.yaml

      - name: Deploy frontend
        run: |
          kubectl apply -f k8s/frontend/deployment.yaml
          kubectl apply -f k8s/frontend/service.yaml

      - name: Apply ingress
        run: kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/homely-backend  -n homely --timeout=180s
          kubectl rollout status deployment/homely-frontend -n homely --timeout=180s

      - name: Verify deployment
        run: |
          echo "── Pods ──────────────────────────────────"
          kubectl get pods -n homely
          echo "── Services ──────────────────────────────"
          kubectl get svc  -n homely
          echo "── Ingress ───────────────────────────────"
          kubectl get ingress -n homely
